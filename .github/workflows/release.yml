name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry run: builds and signs everything, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain = the MSRV, so release builds are reproducible.
  RUST_TOOLCHAIN: "1.88.0"

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match workspace version $ver"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build (reproducible settings)
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sysroot="$(rustc --print sysroot)"
          commit="$(rustc -vV | sed -n 's/^commit-hash: //p')"
          export RUSTFLAGS="--remap-path-prefix=$PWD=. --remap-path-prefix=$HOME/.cargo=~/.cargo --remap-path-prefix=$sysroot/lib/rustlib/src/rust=/rustc/$commit"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: pkg
        shell: bash
        run: |
          name="launcher-tags-sync-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/launcher-tags-sync" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged binary
        shell: bash
        run: |
          "dist/${{ steps.pkg.outputs.name }}/launcher-tags-sync" sync \
            --kvaesitso fixtures/basic/input.kvaesitso \
            --quicksearch fixtures/basic/input.quicksearch \
            --output "$RUNNER_TEMP/out.quicksearch"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  android:
    name: build Android APK/AAB
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "30.0.16248370"
      RUST_ANDROID_TOOLCHAIN: "1.100.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_ANDROID_TOOLCHAIN }}
          components: rust-src
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk and Android SDK packages
        run: |
          cargo install cargo-ndk --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon --no-build-cache testDebugUnitTest assembleRelease bundleRelease

      - name: Verify signature and package
        shell: bash
        run: |
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$bt/apksigner" verify --print-certs "$apk" | grep -E 'DN|SHA-256'
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          cp "$apk" "dist/launcher-tags-sync-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/launcher-tags-sync-${GITHUB_REF_NAME}.aab"
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $GITHUB_REF_NAME" > notes.md; fi
          {
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          # The AAB (for Google Play) stays a workflow artifact; users get the APK.
          rm -f dist/*.aab dist/*.aab.sha256
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.apk dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
